name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  docker-build:

    runs-on: ubuntu-latest

    steps:

      -name: Checkout Repository
        uses: actions/checkout@v4

      -name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      -name: Build Docker Images
       run: docker build -t docker-ci:vl .
